<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Envoyer une invitation — Voliuz Transport</title>
  <meta name="description" content="Page interne : envoyer un SMS invitant un client à réserver sa course." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚕</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="brand-mark">🚕</span>
        Voliuz Transport
      </a>
      <nav>
        <a href="index.html">Accueil</a>
      </nav>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>Envoyer une invitation</h1>
      <p>Page interne : envoie un SMS invitant un client à réserver sa course.</p>
    </div>
  </div>

  <div class="res-layout">
    <div class="container" style="max-width: 480px;">
      <section class="panel">
        <form id="invite-form" class="auth-form" style="flex-direction: column;">
          <div class="field">
            <label for="admin-key-input">Clé admin</label>
            <input type="password" id="admin-key-input" placeholder="Clé secrète" required autocomplete="off" />
          </div>
          <div class="field">
            <label for="invite-phone-input">Numéro du client</label>
            <input type="tel" id="invite-phone-input" placeholder="+32 470 12 34 56" required autocomplete="off" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="invite-btn">Envoyer l'invitation</button>
        </form>
        <div id="invite-msg" class="form-msg"></div>
      </section>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Voliuz Transport</span>
      <span>Page interne — non destinée aux clients</span>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script type="module" src="js/invite.js"></script>
</body>
</html>
